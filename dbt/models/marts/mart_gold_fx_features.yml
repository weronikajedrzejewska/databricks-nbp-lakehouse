version: 2

models:
  - name: mart_gold_fx_features
    description: Gold feature table for FX analytics and downstream ML use cases.
    columns:
      - name: date
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: return_1d
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 10
              config:
                severity: warn
      - name: return_7d
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 10
              config:
                severity: warn
      - name: volatility_reliable
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - currency
